name = "prebell-generator"
main = "build/worker/shim.mjs"
compatibility_date = "2025-01-01"

[build]
command = "worker-build --release"

[triggers]
# Every 5 min across both DST offsets of the 8:30-9:25 ET window; hourly afterwards for ZH retries.
# `clock` decides what each firing means.
# "* * * * *" drives earnings (EDGAR polling, calendar, builds); the Worker
# queues it only on weekdays 06:00-22:00 ET.
crons = ["*/5 12-14 * * MON-FRI", "0 15-23 * * MON-FRI", "* * * * *"]  # named days: Cloudflare numbers 1 = Sunday

[[d1_databases]]
binding = "DB"
database_name = "prebell"
database_id = "eb17fcaf-48fd-4956-88c6-d5ef18ac2662"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "FACTS"
bucket_name = "prebell-facts"

[[queues.producers]]
binding = "JOBS"
queue = "prebell-jobs"

[[queues.consumers]]
queue = "prebell-jobs"

# Earnings jobs (every minute in the ET polling window) on their own queue:
# one consumer and one message per batch, so builds never run in parallel
# (EDGAR fair access, one build per filing) and never delay the premarket job.
[[queues.producers]]
binding = "EARNINGS"
queue = "prebell-earnings"

[[queues.consumers]]
queue = "prebell-earnings"
max_batch_size = 1
max_concurrency = 1

[vars]
# LLM_PROVIDER: "claude" (default; secret ANTHROPIC_API_KEY) or "deepseek" (fallback; secret DEEPSEEK_API_KEY).
# Optional LLM_MODEL overrides the provider's default model (claude-sonnet-5-5 / deepseek-chat).
# LLM_EFFORT (Claude only): low | medium | high, or "none" to omit the field for models without effort support.
# See docs/runbook.md.
LLM_PROVIDER = "claude"
LLM_EFFORT = "low"
SEC_CONTACT = "placeholder@example.com"
