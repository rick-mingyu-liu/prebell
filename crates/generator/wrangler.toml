name = "prebell-generator"
main = "build/worker/shim.mjs"
compatibility_date = "2025-01-01"

[build]
command = "worker-build --release"

[triggers]
# UTC. Each cron maps to its jobs in crates/core/src/schedule.rs (a test keeps
# the two in sync); `clock` decides what each firing means in ET.
# Two crons: the Free Workers plan allows 5 per account. Day names, not numbers
# (Cloudflare numbers weekdays 1-7 starting on Sunday), and no comma lists.
# - "*/5 10-23 * * MON-FRI": earnings polling from 06:00 ET (both offsets), premarket,
#   the premarket update and recap (both windows, ZH retries)
# - "*/5 0-3 * * TUE-SAT": the EST recap tail to 19:00 ET, recap ZH retries and
#   earnings polling to 22:00 ET
crons = ["*/5 10-23 * * MON-FRI", "*/5 0-3 * * TUE-SAT"]

[[d1_databases]]
binding = "DB"
database_name = "prebell"
database_id = "eb17fcaf-48fd-4956-88c6-d5ef18ac2662"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "FACTS"
bucket_name = "prebell-facts"

[[queues.producers]]
binding = "JOBS"
queue = "prebell-jobs"

[[queues.consumers]]
queue = "prebell-jobs"
# One job per invocation, so a build never shares an invocation's subrequest
# budget with another job.
max_batch_size = 1

# Earnings polls and the calendar refresh on their own queue: one consumer and
# one message per batch, so a poll is never run twice at once and an earnings
# step never delays the premarket job.
[[queues.producers]]
binding = "EARNINGS"
queue = "prebell-earnings"

[[queues.consumers]]
queue = "prebell-earnings"
max_batch_size = 1
max_concurrency = 1
# Redeliver a failed message once, not the default 3 times: a poll killed for
# CPU would only fail again, and the next firing polls anyway.
max_retries = 1

# Earnings builds on a third queue, one at a time, so a morning burst of
# builds (1-5 min each) never holds up the polls behind it. A build's EDGAR
# client pauses 250 ms between requests (the poll's 125 ms), so the two
# together stay under SEC's 10 requests/second.
[[queues.producers]]
binding = "EARNINGS_BUILD"
queue = "prebell-earnings-build"

[[queues.consumers]]
queue = "prebell-earnings-build"
max_batch_size = 1
max_concurrency = 1
max_retries = 1

[vars]
# LLM_PROVIDER: "claude" (default; secret ANTHROPIC_API_KEY) or "deepseek" (fallback; secret DEEPSEEK_API_KEY).
# Optional LLM_MODEL overrides the provider's default model (claude-sonnet-5-5 / deepseek-flash).
# LLM_EFFORT (Claude only): low | medium | high, or "none" to omit the field for models without effort support.
# See docs/runbook.md.
LLM_PROVIDER = "claude"
LLM_EFFORT = "low"
SEC_CONTACT = "support@prebell.site"
# Unused since covers became data graphics (2026-11-05); kept until the owner removes it.
CF_ACCOUNT_ID = "ed6569531d89c3e00705807340c7b75f"
# Earnings calendar seeding: "yahoo" (Yahoo v7 quote earnings dates, the default)
# or "off" (only company announcements and EDGAR filings).
EARNINGS_CALENDAR_SEED = "yahoo"
# Weekly digest (docs/runbook.md "Weekly digest"): on. Unset or anything but
# exactly "true" means no digest message is queued. "true" queues one on Friday
# evenings: with the BUTTONDOWN_API_KEY secret it saves next week's English email
# as a Buttondown draft for every subscriber; without the secret it is a dry run
# that gathers and renders and sends nothing. To turn it off, delete this line.
DIGEST_ENABLED = "true"
# DIGEST_MODE: "draft" (the default; the owner sends it) or "scheduled" (Sunday
# 18:00 ET).
DIGEST_MODE = "draft"
# IPO watch (docs/runbook.md "IPO watch"): on. Only exactly "true" is on; unset,
# " true" or "TRUE" is off. Off means no hourly EDGAR filing check, no news
# sweeps (Tavily and the LLM) and no extra symbols in the recap; the site keeps
# showing what is stored. To turn it off, delete this line and deploy.
IPO_WATCH_ENABLED = "true"
# IPO write-ups at filing milestones (docs/runbook.md "IPO write-ups"): on, Rick
# 2026-11-11. Only exactly "true" is on, and only with IPO_WATCH_ENABLED on too.
# Off means no ipo:article messages (the write-ups are written by code); published
# write-ups stay. To turn it off, delete this line and deploy.
IPO_ARTICLES_ENABLED = "true"
