name = "prebell-generator"
main = "build/worker/shim.mjs"
compatibility_date = "2025-01-01"

[build]
command = "worker-build --release"

[triggers]
# Every 5 min across both DST offsets of the 8:30-9:25 ET window; hourly afterwards for ZH retries.
# `clock` decides what each firing means.
# "30 11,12 * * *" is the daily competitor watch (07:30 ET in either offset; must match
# COMPETITOR_CRON in src/lib.rs; `core::competitor` picks the firing that counts).
crons = ["*/5 12-14 * * 1-5", "0 15-23 * * 1-5", "30 11,12 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "prebell"
database_id = "eb17fcaf-48fd-4956-88c6-d5ef18ac2662"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "FACTS"
bucket_name = "prebell-facts"

[[queues.producers]]
binding = "JOBS"
queue = "prebell-jobs"

[[queues.consumers]]
queue = "prebell-jobs"

[vars]
LLM_PROVIDER = "deepseek"
SEC_CONTACT = "placeholder@example.com"
