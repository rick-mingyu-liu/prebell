name = "prebell-generator"
main = "build/worker/shim.mjs"
compatibility_date = "2025-01-01"

[build]
command = "worker-build --release"

[triggers]
# UTC. Each cron maps to its job in crates/core/src/schedule.rs (a test keeps
# the two in sync); `clock` and `core::competitor` decide what each firing means in ET.
# Day names, not numbers: Cloudflare numbers weekdays 1-7 starting on Sunday.
# - premarket: every 5 min over the 8:30-9:25 ET window (EDT and EST), hourly ZH retries
# - recap: every 5 min over 13:45/16:45-19:00 ET (EDT and EST), hourly ZH retries to 22:00 ET
# - competitor: "31 11 * * *" and "31 12 * * *" are 07:31 ET in either offset, at minute 31 so
#   no other cron fires with them; `core::competitor` picks the firing that counts.
crons = ["*/5 12-14 * * MON-FRI", "0 15-23 * * MON-FRI", "*/5 17-23 * * MON-FRI", "*/5 0 * * TUE-SAT", "0 1-3 * * TUE-SAT", "31 11 * * *", "31 12 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "prebell"
database_id = "eb17fcaf-48fd-4956-88c6-d5ef18ac2662"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "FACTS"
bucket_name = "prebell-facts"

[[queues.producers]]
binding = "JOBS"
queue = "prebell-jobs"

[[queues.consumers]]
queue = "prebell-jobs"
# One job per invocation: a recap build makes ~520 subrequests, so it never
# shares an invocation's budget with another job.
max_batch_size = 1

[vars]
# LLM_PROVIDER: "claude" (default; secret ANTHROPIC_API_KEY) or "deepseek" (fallback; secret DEEPSEEK_API_KEY).
# Optional LLM_MODEL overrides the provider's default model (claude-sonnet-5-5 / deepseek-chat).
# LLM_EFFORT (Claude only): low | medium | high, or "none" to omit the field for models without effort support.
# See docs/runbook.md.
LLM_PROVIDER = "claude"
LLM_EFFORT = "low"
SEC_CONTACT = "placeholder@example.com"
