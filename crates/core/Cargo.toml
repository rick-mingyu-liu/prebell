[package]
name = "prebell-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "prebell_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
async-trait = "0.1"
regex = "1"
thiserror = "2"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
plotters = { version = "0.3", default-features = false, features = ["svg_backend"] }
# Share cards: the SVG cover to PNG, with embedded fonts only (no system fonts, no raster inputs).
resvg = { version = "0.45", default-features = false, features = ["text"] }
png = "0.17"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
ttf-parser = "0.25"

# The week post's Wasm CPU probe (crates/core/examples/week-cpu.rs): renders and
# checks the peak-week bundle, run under node with --cpu-prof. Not shipped.
[[example]]
name = "week-cpu"
crate-type = ["cdylib"]
