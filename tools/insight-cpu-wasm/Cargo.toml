# The insight step's CPU in V8: the Worker's own target (wasm32-unknown-unknown)
# run under Node, which needs no extra toolchain. Outside the main workspace,
# like tools/insight-trial, so the Worker build and the root Cargo.lock are
# untouched.
[package]
name = "insight-cpu-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
prebell-core = { path = "../../crates/core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
